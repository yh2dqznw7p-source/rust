# SPDX-License-Identifier: MIT
# Unity build via GameCI (https://game.ci).
#
# REQUIREMENTS to enable this workflow:
#   1. Add repo secrets:
#        UNITY_LICENSE       — content of your Unity_v2022.x.ulf
#        UNITY_EMAIL         — Unity account email
#        UNITY_PASSWORD      — Unity account password (or use serial)
#        UNITY_SERIAL        — (optional) Unity Pro serial
#   2. Without these secrets the build job is auto-skipped, so the workflow
#      stays green for forks / first-time clones.
#
# How to obtain a free Personal license file:
#   See https://game.ci/docs/github/activation/activation-personal
#
# Builds run on a GameCI Docker image that already has Unity 2022.3 LTS,
# URP package cache, IL2CPP, mono, and Linux/Windows/macOS toolchains.

name: Unity build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel stale runs on the same branch (saves CI minutes).
concurrency:
  group: unity-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  precheck:
    name: Check Unity license is configured
    runs-on: ubuntu-latest
    outputs:
      has_license: ${{ steps.check.outputs.has_license }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "${UNITY_LICENSE:-}" ]; then
            echo "has_license=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_license=false" >> "$GITHUB_OUTPUT"
            echo "::warning::UNITY_LICENSE secret is not set; Unity build job will be skipped."
          fi

  build:
    name: Build (${{ matrix.targetPlatform }})
    needs: precheck
    if: needs.precheck.outputs.has_license == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # StandaloneWindows64 from a Linux runner needs a Mono image variant
        # of the GameCI editor. Once we want a Windows client artifact, add it
        # back here AND swap the unity-builder image. Keeping Linux-only for
        # the initial CI cycle to minimize moving parts.
        targetPlatform:
          - StandaloneLinux64
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Library/ caching shaves ~5–10 min off subsequent builds.
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('unity/Packages/manifest.json') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL:   ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: unity
          targetPlatform: ${{ matrix.targetPlatform }}
          unityVersion: 2022.3.40f1
          # Empty scene + RuntimeInitializeOnLoadMethod is enough for Phase 0.
          # When we have proper scenes, set the scene list here or via Build
          # Settings committed to ProjectSettings/EditorBuildSettings.asset.
          allowDirtyBuild: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustlike-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
          if-no-files-found: warn
          retention-days: 14

  # Headless server build. Uses the same Unity license; toggles -DUNITY_SERVER
  # and the server build flag via a tiny editor script (added in Phase 0
  # close-out). For now we keep the matrix entry placeholder so wiring is ready.
  server-build:
    name: Build (Linux server, headless)
    needs: precheck
    if: needs.precheck.outputs.has_license == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-LinuxServer-${{ hashFiles('unity/Packages/manifest.json') }}
          restore-keys: |
            Library-LinuxServer-
            Library-

      - name: Build server
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL:   ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: unity
          targetPlatform: StandaloneLinux64
          unityVersion: 2022.3.40f1
          customParameters: -standaloneBuildSubtarget Server
          buildName: RustLikeServer
          allowDirtyBuild: true

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustlike-server-linux64
          path: build/StandaloneLinux64
          if-no-files-found: warn
          retention-days: 14
